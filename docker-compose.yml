services:
  backend:
    build:
      context: .
      target: server
    environment:
      DATABASE_PATH: /app/server/data/users.sqlite
      NODE_ENV: production
      PORT: 3001
      TYPEORM_SYNCHRONIZE: "true"
    ports:
      - "3001:3001"
    volumes:
      - users-data:/app/server/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      target: client
      args:
        VITE_API_BASE_URL: http://localhost:3001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

  seed:
    build:
      context: .
      target: server
    command: ["node", "server/dist/seed/seed.js"]
    environment:
      DATABASE_PATH: /app/server/data/users.sqlite
      NODE_ENV: production
      TYPEORM_SYNCHRONIZE: "true"
    profiles:
      - seed
    volumes:
      - users-data:/app/server/data

volumes:
  users-data:
